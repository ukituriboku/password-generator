
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e293b">
  <title>パスワード生成アプリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #334155);
      font-family: Arial, "Noto Sans JP", sans-serif;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 25px;
      background: #fff;
      color: #333;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin: 0 0 25px;
      text-align: center;
      font-size: 24px;
      color: #1e293b;
    }

    .section {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 18px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .radio-option input {
      width: 20px;
      height: 20px;
      accent-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    .copy-button {
      margin-top: 10px;
      background: #0f766e;
    }

    #random-string {
      min-height: 55px;
      margin: 20px 0 0;
      padding: 15px 10px;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      background: #f1f5f9;
      color: #1e293b;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-all;
    }

    #message {
      min-height: 20px;
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: #0f766e;
    }

    @media (max-width: 400px) {
      .container {
        padding: 20px 16px;
      }

      h1 {
        font-size: 21px;
      }

      #random-string {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>パスワード生成</h1>

    <div class="section">
      <label for="length">文字数</label>
      <input
        type="number"
        id="length"
        min="1"
        max="100"
        value="8"
        inputmode="numeric"
      >
    </div>

    <div class="section">
      <label>文字の種類</label>

      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" id="digits"
                 name="charset" value="digits" checked>
          数字のみ
        </label>

        <label class="radio-option">
          <input type="radio" id="letters"
                 name="charset" value="letters">
          英字＋数字
        </label>
      </div>
    </div>

    <button type="button" onclick="generateRandomString()">
      パスワード生成
    </button>

    <p id="random-string">ここに表示されます</p>

    <button type="button" class="copy-button"
            onclick="copyPassword()">
      コピー
    </button>

    <div id="message"></div>

  </div>

  <script>
    function generateRandomString() {
      const lengthInput = document.getElementById("length");
      const length = Number(lengthInput.value);

      if (!Number.isInteger(length) || length < 1 || length > 100) {
        alert("文字数は1～100の整数で指定してください。");
        return;
      }

      const useDigits = document.getElementById("digits").checked;

      let charset;

      if (useDigits) {
        charset = "0123456789";
      } else {
        charset =
          "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      }

      // 暗号学的に安全な乱数を使用
      const randomValues = new Uint32Array(length);
      const result = [];

      const limit = Math.floor(
        4294967296 / charset.length
      ) * charset.length;

      let i = 0;

      while (i < length) {
        crypto.getRandomValues(randomValues);

        for (let j = 0; j < randomValues.length && i < length; j++) {
          if (randomValues[j] < limit) {
            result.push(charset[randomValues[j] % charset.length]);
            i++;
          }
        }
      }

      document.getElementById("random-string").textContent =
        result.join("");

      document.getElementById("message").textContent = "";
    }

    async function copyPassword() {
      const password =
        document.getElementById("random-string").textContent;

      if (password === "ここに表示されます") {
        alert("先にパスワードを生成してください。");
        return;
      }

      try {
        await navigator.clipboard.writeText(password);
        document.getElementById("message").textContent =
          "パスワードをコピーしました。";
      } catch (error) {
        document.getElementById("message").textContent =
          "コピーできませんでした。パスワードを選択してコピーしてください。";
      }
    }
  </script>

</body>
</html>
